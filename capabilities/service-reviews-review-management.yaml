      - name: getreviewtags
        method: GET
        description: Get Review Tags
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: reviewId
          in: path
          type: string
          required: true
      - name: setreviewtags
        method: POST
        description: Set Review Tags
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
