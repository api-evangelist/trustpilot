        description: Delete Review Tag
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: reviewId
          in: path
          type: string
          required: true
        - name: group
          in: query
          type: string
          required: true
        - name: value
          in: query
          type: string
          required: true
