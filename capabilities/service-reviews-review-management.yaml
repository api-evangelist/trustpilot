      operations:
      - name: getprivatereview
        method: GET
        description: Get Private Review
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: reviewId
          in: path
          type: string
          required: true
    - name: v1-private-reviews-reviewId-find-reviewer
      path: /v1/private/reviews/{reviewId}/find-reviewer
      operations:
      - name: findreviewer
