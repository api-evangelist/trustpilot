naftiko: 1.0.0-alpha2
info:
  label: Trustpilot Business Units API — Reviews
  description: 'Trustpilot Business Units API — Reviews. 3 operations. Lead operation: Get All Business Unit Reviews. Self-contained
    Naftiko capability covering one Trustpilot business surface.'
  tags:
  - Trustpilot
  - Reviews
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRUSTPILOT_API_KEY: TRUSTPILOT_API_KEY
capability:
  consumes:
  - type: http
    namespace: business-units-reviews
    baseUri: https://api.trustpilot.com
    description: Trustpilot Business Units API — Reviews business capability. Self-contained, no shared references.
    resources:
    - name: v1-business-units-businessUnitId-all-reviews
      path: /v1/business-units/{businessUnitId}/all-reviews
      operations:
      - name: getallbusinessunitreviews
        method: GET
        description: Get All Business Unit Reviews
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: businessUnitId
          in: path
          type: string
          required: true
        - name: pageToken
          in: query
          type: string
          description: Pagination cursor from previous response
        - name: perPage
          in: query
          type: integer
        - name: apikey
          in: query
          type: string
          required: true
    - name: v1-business-units-businessUnitId-reviews
      path: /v1/business-units/{businessUnitId}/reviews
      operations:
      - name: getbusinessunitreviews
        method: GET
        description: Get Business Unit Reviews
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: businessUnitId
          in: path
          type: string
          required: true
        - name: stars
          in: query
          type: array
          description: Filter by star rating
        - name: language
          in: query
          type: string
          description: Filter reviews by language (ISO 639-1 code)
        - name: orderBy
          in: query
          type: string
          description: Sort order for reviews
        - name: page
          in: query
          type: integer
        - name: perPage
          in: query
          type: integer
        - name: apikey
          in: query
          type: string
          required: true
    - name: v1-private-business-units-businessUnitId-reviews
      path: /v1/private/business-units/{businessUnitId}/reviews
      operations:
      - name: getprivatebusinessunitreviews
        method: GET
        description: Get Private Business Unit Reviews
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: businessUnitId
          in: path
          type: string
          required: true
        - name: page
          in: query
          type: integer
        - name: perPage
          in: query
          type: integer
    authentication:
      type: bearer
      token: '{{env.TRUSTPILOT_API_KEY}}'
  exposes:
  - type: rest
    namespace: business-units-reviews-rest
    port: 8080
    description: REST adapter for Trustpilot Business Units API — Reviews. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v1/business-units/{businessunitid}/all-reviews
      name: v1-business-units-businessunitid-all-reviews
      description: REST surface for v1-business-units-businessUnitId-all-reviews.
      operations:
      - method: GET
        name: getallbusinessunitreviews
        description: Get All Business Unit Reviews
        call: business-units-reviews.getallbusinessunitreviews
        with:
          businessUnitId: rest.businessUnitId
          pageToken: rest.pageToken
          perPage: rest.perPage
          apikey: rest.apikey
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/business-units/{businessunitid}/reviews
      name: v1-business-units-businessunitid-reviews
      description: REST surface for v1-business-units-businessUnitId-reviews.
      operations:
      - method: GET
        name: getbusinessunitreviews
        description: Get Business Unit Reviews
        call: business-units-reviews.getbusinessunitreviews
        with:
          businessUnitId: rest.businessUnitId
          stars: rest.stars
          language: rest.language
          orderBy: rest.orderBy
          page: rest.page
          perPage: rest.perPage
          apikey: rest.apikey
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/private/business-units/{businessunitid}/reviews
      name: v1-private-business-units-businessunitid-reviews
      description: REST surface for v1-private-business-units-businessUnitId-reviews.
      operations:
      - method: GET
        name: getprivatebusinessunitreviews
        description: Get Private Business Unit Reviews
        call: business-units-reviews.getprivatebusinessunitreviews
        with:
          businessUnitId: rest.businessUnitId
          page: rest.page
          perPage: rest.perPage
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: business-units-reviews-mcp
    port: 9090
    transport: http
    description: MCP adapter for Trustpilot Business Units API — Reviews. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-all-business-unit-reviews
      description: Get All Business Unit Reviews
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: business-units-reviews.getallbusinessunitreviews
      with:
        businessUnitId: tools.businessUnitId
        pageToken: tools.pageToken
        perPage: tools.perPage
        apikey: tools.apikey
      outputParameters:
      - type: object
        mapping: $.
    - name: get-business-unit-reviews
      description: Get Business Unit Reviews
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: business-units-reviews.getbusinessunitreviews
      with:
        businessUnitId: tools.businessUnitId
        stars: tools.stars
        language: tools.language
        orderBy: tools.orderBy
        page: tools.page
        perPage: tools.perPage
        apikey: tools.apikey
      outputParameters:
      - type: object
        mapping: $.
    - name: get-private-business-unit-reviews
      description: Get Private Business Unit Reviews
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: business-units-reviews.getprivatebusinessunitreviews
      with:
        businessUnitId: tools.businessUnitId
        page: tools.page
        perPage: tools.perPage
      outputParameters:
      - type: object
        mapping: $.
