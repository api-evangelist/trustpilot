naftiko: "1.0.0-alpha1"

info:
  label: "Trustpilot Business Units API"
  description: "Provides business unit profile data, review retrieval, images, categories, and web links."
  tags:
    - Reviews
    - Business Profiles
    - Trust
    - Ratings
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      TRUSTPILOT_API_KEY: TRUSTPILOT_API_KEY

capability:
  consumes:
    - type: http
      namespace: trustpilot-business-units
      baseUri: https://api.trustpilot.com
      description: "Trustpilot business unit profile and review data."
      authentication:
        type: apikey
        key: apikey
        value: "{{TRUSTPILOT_API_KEY}}"
        placement: query
      resources:
        - name: business-unit-search
          path: /v1/business-units/search
          description: "Search for business units by name"
          operations:
            - name: search-business-units
              method: GET
              description: "Search for business units on Trustpilot by name."
              inputParameters:
                - name: name
                  in: query
                  type: string
                  required: false
                  description: "Business name or partial name"
                - name: country
                  in: query
                  type: string
                  required: false
                  description: "ISO 3166-1 alpha-2 country code"
                - name: page
                  in: query
                  type: integer
                  required: false
                - name: perPage
                  in: query
                  type: integer
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: business-unit-profile
          path: /v1/business-units/{businessUnitId}/profileinfo
          description: "Business unit profile information"
          operations:
            - name: get-business-unit-profile
              method: GET
              description: "Retrieve company profile information."
              inputParameters:
                - name: businessUnitId
                  in: path
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: business-unit-reviews
          path: /v1/business-units/{businessUnitId}/reviews
          description: "Public business unit reviews"
          operations:
            - name: get-business-unit-reviews
              method: GET
              description: "Fetch public reviews for a business unit."
              inputParameters:
                - name: businessUnitId
                  in: path
                  type: string
                  required: true
                - name: stars
                  in: query
                  type: array
                  required: false
                - name: language
                  in: query
                  type: string
                  required: false
                - name: orderBy
                  in: query
                  type: string
                  required: false
                - name: page
                  in: query
                  type: integer
                  required: false
                - name: perPage
                  in: query
                  type: integer
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: business-unit-all-reviews
          path: /v1/business-units/{businessUnitId}/all-reviews
          description: "All reviews with cursor pagination"
          operations:
            - name: get-all-business-unit-reviews
              method: GET
              description: "Retrieve all reviews with pageToken cursor pagination."
              inputParameters:
                - name: businessUnitId
                  in: path
                  type: string
                  required: true
                - name: pageToken
                  in: query
                  type: string
                  required: false
                - name: perPage
                  in: query
                  type: integer
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: trustpilot-business-units-api
      resources:
        - path: /v1/business-units/search
          name: business-unit-search
          description: "Search business units"
          operations:
            - method: GET
              name: search-business-units
              description: "Search for business units"
              call: "trustpilot-business-units.search-business-units"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/business-units/{businessUnitId}/profile
          name: business-unit-profile
          description: "Get business unit profile"
          operations:
            - method: GET
              name: get-business-unit-profile
              description: "Get profile information"
              call: "trustpilot-business-units.get-business-unit-profile"
              with:
                businessUnitId: "rest.businessUnitId"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/business-units/{businessUnitId}/reviews
          name: business-unit-reviews
          description: "Get business unit reviews"
          operations:
            - method: GET
              name: get-business-unit-reviews
              description: "List reviews"
              call: "trustpilot-business-units.get-business-unit-reviews"
              with:
                businessUnitId: "rest.businessUnitId"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: trustpilot-business-units-mcp
      transport: http
      tools:
        - name: search-business-units
          description: "Search for business units on Trustpilot by name or partial name."
          hints:
            readOnly: true
            openWorld: true
          call: "trustpilot-business-units.search-business-units"
          with:
            name: "tools.name"
            country: "tools.country"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-business-unit-profile
          description: "Get company profile information including trust score, review counts, and contact details."
          hints:
            readOnly: true
            openWorld: false
          call: "trustpilot-business-units.get-business-unit-profile"
          with:
            businessUnitId: "tools.businessUnitId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-business-unit-reviews
          description: "Get public reviews for a business unit with filtering by stars, language, and sort order."
          hints:
            readOnly: true
            openWorld: false
          call: "trustpilot-business-units.get-business-unit-reviews"
          with:
            businessUnitId: "tools.businessUnitId"
            stars: "tools.stars"
            language: "tools.language"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-all-business-unit-reviews
          description: "Retrieve all reviews for a business unit using cursor-based pagination for large datasets."
          hints:
            readOnly: true
            openWorld: false
          call: "trustpilot-business-units.get-all-business-unit-reviews"
          with:
            businessUnitId: "tools.businessUnitId"
            pageToken: "tools.pageToken"
          outputParameters:
            - type: object
              mapping: "$."
