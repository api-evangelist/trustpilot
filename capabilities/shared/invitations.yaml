naftiko: "1.0.0-alpha1"

info:
  label: "Trustpilot Invitation API"
  description: "Send review invitations via email, create invitation links, and manage invitation templates."
  tags:
    - Invitations
    - Reviews
    - Email
    - Trust
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      TRUSTPILOT_OAUTH2_TOKEN: TRUSTPILOT_OAUTH2_TOKEN

capability:
  consumes:
    - type: http
      namespace: trustpilot-invitations
      baseUri: https://api.trustpilot.com
      description: "Trustpilot invitation management."
      authentication:
        type: bearer
        token: "{{TRUSTPILOT_OAUTH2_TOKEN}}"
      resources:
        - name: invitation-templates
          path: /v1/private/business-units/{businessUnitId}/templates
          description: "Invitation email templates"
          operations:
            - name: get-invitation-templates
              method: GET
              description: "Retrieve available invitation templates."
              inputParameters:
                - name: businessUnitId
                  in: path
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: email-invitations
          path: /v1/private/business-units/{businessUnitId}/email-invitations
          description: "Send email invitations"
          operations:
            - name: send-email-invitations
              method: POST
              description: "Send email invitations for service and product reviews."
              inputParameters:
                - name: businessUnitId
                  in: path
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  invitations: "{{tools.invitations}}"
        - name: invitation-links
          path: /v1/private/business-units/{businessUnitId}/invitation-links
          description: "Service review invitation links"
          operations:
            - name: create-invitation-link
              method: POST
              description: "Create a unique invitation link for service reviews."
              inputParameters:
                - name: businessUnitId
                  in: path
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  referenceNumber: "{{tools.referenceNumber}}"
                  redirectUrl: "{{tools.redirectUrl}}"

  exposes:
    - type: rest
      port: 8102
      namespace: trustpilot-invitations-api
      resources:
        - path: /v1/invitations/templates
          name: invitation-templates
          description: "Invitation templates"
          operations:
            - method: GET
              name: get-invitation-templates
              description: "Get invitation templates"
              call: "trustpilot-invitations.get-invitation-templates"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/invitations/email
          name: email-invitations
          description: "Send email invitations"
          operations:
            - method: POST
              name: send-email-invitations
              description: "Send email review invitations"
              call: "trustpilot-invitations.send-email-invitations"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/invitations/links
          name: invitation-links
          description: "Create invitation links"
          operations:
            - method: POST
              name: create-invitation-link
              description: "Create invitation link"
              call: "trustpilot-invitations.create-invitation-link"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9102
      namespace: trustpilot-invitations-mcp
      transport: http
      tools:
        - name: get-invitation-templates
          description: "Retrieve available email invitation templates for a business unit."
          hints:
            readOnly: true
            openWorld: false
          call: "trustpilot-invitations.get-invitation-templates"
          with:
            businessUnitId: "tools.businessUnitId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: send-email-invitations
          description: "Send email review invitations to customers after purchase or service interaction."
          hints:
            readOnly: false
            openWorld: false
          call: "trustpilot-invitations.send-email-invitations"
          with:
            businessUnitId: "tools.businessUnitId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-invitation-link
          description: "Create a unique review invitation link for a specific order or reference."
          hints:
            readOnly: false
            openWorld: false
          call: "trustpilot-invitations.create-invitation-link"
          with:
            businessUnitId: "tools.businessUnitId"
          outputParameters:
            - type: object
              mapping: "$."
