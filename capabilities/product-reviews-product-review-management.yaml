naftiko: 1.0.0-alpha2
info:
  label: Trustpilot Product Reviews API — Product Review Management
  description: 'Trustpilot Product Reviews API — Product Review Management. 4 operations. Lead operation: Create Product Review
    Invitation Link. Self-contained Naftiko capability covering one Trustpilot business surface.'
  tags:
  - Trustpilot
  - Product Review Management
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRUSTPILOT_API_KEY: TRUSTPILOT_API_KEY
capability:
  consumes:
  - type: http
    namespace: product-reviews-product-review-management
    baseUri: https://api.trustpilot.com
    description: Trustpilot Product Reviews API — Product Review Management business capability. Self-contained, no shared
      references.
    resources:
    - name: v1-private-product-reviews-business-units-businessUnitId-invitation-links
      path: /v1/private/product-reviews/business-units/{businessUnitId}/invitation-links
      operations:
      - name: createproductreviewinvitationlink
        method: POST
        description: Create Product Review Invitation Link
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: businessUnitId
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: v1-private-product-reviews-business-units-businessUnitId-reviews
      path: /v1/private/product-reviews/business-units/{businessUnitId}/reviews
      operations:
      - name: getprivateproductreviews
        method: GET
        description: Get Private Product Reviews
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: businessUnitId
          in: path
          type: string
          required: true
        - name: page
          in: query
          type: integer
        - name: perPage
          in: query
          type: integer
    - name: v1-private-product-reviews-business-units-businessUnitId-summaries
      path: /v1/private/product-reviews/business-units/{businessUnitId}/summaries
      operations:
      - name: getprivateproductreviewssummaries
        method: GET
        description: Get Private Product Reviews Summaries
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: businessUnitId
          in: path
          type: string
          required: true
    - name: v1-private-product-reviews-reviewId
      path: /v1/private/product-reviews/{reviewId}
      operations:
      - name: getprivateproductreview
        method: GET
        description: Get Private Product Review
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: reviewId
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.TRUSTPILOT_API_KEY}}'
  exposes:
  - type: rest
    namespace: product-reviews-product-review-management-rest
    port: 8080
    description: REST adapter for Trustpilot Product Reviews API — Product Review Management. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/v1/private/product-reviews/business-units/{businessunitid}/invitation-links
      name: v1-private-product-reviews-business-units-businessunitid-invitation-links
      description: REST surface for v1-private-product-reviews-business-units-businessUnitId-invitation-links.
      operations:
      - method: POST
        name: createproductreviewinvitationlink
        description: Create Product Review Invitation Link
        call: product-reviews-product-review-management.createproductreviewinvitationlink
        with:
          businessUnitId: rest.businessUnitId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/private/product-reviews/business-units/{businessunitid}/reviews
      name: v1-private-product-reviews-business-units-businessunitid-reviews
      description: REST surface for v1-private-product-reviews-business-units-businessUnitId-reviews.
      operations:
      - method: GET
        name: getprivateproductreviews
        description: Get Private Product Reviews
        call: product-reviews-product-review-management.getprivateproductreviews
        with:
          businessUnitId: rest.businessUnitId
          page: rest.page
          perPage: rest.perPage
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/private/product-reviews/business-units/{businessunitid}/summaries
      name: v1-private-product-reviews-business-units-businessunitid-summaries
      description: REST surface for v1-private-product-reviews-business-units-businessUnitId-summaries.
      operations:
      - method: GET
        name: getprivateproductreviewssummaries
        description: Get Private Product Reviews Summaries
        call: product-reviews-product-review-management.getprivateproductreviewssummaries
        with:
          businessUnitId: rest.businessUnitId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/private/product-reviews/{reviewid}
      name: v1-private-product-reviews-reviewid
      description: REST surface for v1-private-product-reviews-reviewId.
      operations:
      - method: GET
        name: getprivateproductreview
        description: Get Private Product Review
        call: product-reviews-product-review-management.getprivateproductreview
        with:
          reviewId: rest.reviewId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: product-reviews-product-review-management-mcp
    port: 9090
    transport: http
    description: MCP adapter for Trustpilot Product Reviews API — Product Review Management. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: create-product-review-invitation-link
      description: Create Product Review Invitation Link
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: product-reviews-product-review-management.createproductreviewinvitationlink
      with:
        businessUnitId: tools.businessUnitId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-private-product-reviews
      description: Get Private Product Reviews
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: product-reviews-product-review-management.getprivateproductreviews
      with:
        businessUnitId: tools.businessUnitId
        page: tools.page
        perPage: tools.perPage
      outputParameters:
      - type: object
        mapping: $.
    - name: get-private-product-reviews-summaries
      description: Get Private Product Reviews Summaries
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: product-reviews-product-review-management.getprivateproductreviewssummaries
      with:
        businessUnitId: tools.businessUnitId
      outputParameters:
      - type: object
        mapping: $.
    - name: get-private-product-review
      description: Get Private Product Review
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: product-reviews-product-review-management.getprivateproductreview
      with:
        reviewId: tools.reviewId
      outputParameters:
      - type: object
        mapping: $.
