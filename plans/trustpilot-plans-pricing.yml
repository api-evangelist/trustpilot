description: Trustpilot Business sells five tiers — a free plan plus Starter, Plus, Premium, and Enterprise
  — priced per domain on a 12-month minimum prepaid contract. Each tier sets a monthly review-invitation
  cap, the number of widgets/users/domains, and the integration count. API access is bundled in Premium
  and Enterprise as an add-on; lower tiers do not include API access.
sources:
  - https://business.trustpilot.com/pricing
  - https://developers.trustpilot.com/
plans:
  - id: trustpilot-free
    name: Free
    type: freemium
    description: No-cost entry plan with basic profile management and a small review-invitation allowance;
      no documented API access.
    entries:
      - label: Review Invitations
        name: review_invitations
        type: quota
        metric: invitation
        limit: 50
        timeFrame: month
        geo: global
        unit: 1
        price: '0'
        userMultiplied: false
    elements:
      - name: Basic Profile Management
      - name: Support Center Access
  - id: trustpilot-starter
    name: Starter
    type: subscription
    description: Entry paid plan for small businesses (up to $5M revenue, new customers only); annual
      prepaid commitment.
    entries:
