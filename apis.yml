aid: trustpilot
url: https://raw.githubusercontent.com/api-evangelist/trustpilot/refs/heads/main/apis.yml
name: Trustpilot
description: >-
  Trustpilot is a global consumer review platform that connects businesses with their customers to build trust through
  transparent, verified reviews. Founded in 2007, Trustpilot hosts hundreds of millions of reviews across millions of
  businesses worldwide. The platform offers business APIs that allow companies to collect, manage, and display reviews
  programmatically, integrate review data into their own systems, and automate invitation workflows to gather customer
  feedback at scale. Trustpilot's APIs cover business profile management, service reviews, product reviews, invitation
  management, consumer profiles, and public review data.
type: Index
