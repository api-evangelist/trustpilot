description: FOCUS-aligned FinOps for Trustpilot's tiered SaaS — annual prepaid subscriptions priced per
  domain (Free, $99 Starter, $319 Plus, $799 Premium, custom Enterprise) with seat, widget, integration,
  and review-invitation caps per tier and a separate API add-on on Premium/Enterprise.
sources:
  - https://business.trustpilot.com/pricing
  - https://developers.trustpilot.com/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Trustpilot A/S
serviceCategory: Reviews & Reputation SaaS
billingModel:
  pricingCategory: Tiered Subscription
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
focusColumns:
  ServiceName: Trustpilot Business
  ServiceCategory: Reviews & Reputation SaaS
  ProviderName: Trustpilot
  PublisherName: Trustpilot A/S
  InvoiceIssuerName: Trustpilot A/S
  BillingCurrency: USD
meters:
  - name: subscription_fee
    description: Annual subscription per domain at the chosen tier (Free, Starter $99/mo, Plus $319/mo,
      Premium $799/mo, Enterprise custom).
    unit: month
    aggregation: sum
    dimensions:
      - tier
      - domain
  - name: review_invitations
    description: Monthly review invitations sent (50 Free, 100 Starter, 300 Plus, 1000 Premium, unlimited
      Enterprise).
    unit: invitation
    aggregation: sum
    dimensions:
      - tier
      - domain
  - name: seats
    description: Active business users on the account.
    unit: seat
    aggregation: max
    dimensions:
      - tier
  - name: domains
    description: Domains under management (1 Starter, up to 3 Plus, unlimited Premium/Enterprise).
    unit: domain
    aggregation: max
    dimensions:
      - tier
  - name: api_addon
    description: API access add-on, available on Premium and Enterprise tiers.
    unit: month
    aggregation: sum
    dimensions:
      - tier
principles:
  - name: Visibility
    description: Track the per-domain tier subscription on the Trustpilot invoice and monitor invitation
      send volume in the Business app to confirm you stay within the monthly cap of your tier.
  - name: Allocation
    description: Allocate spend per domain (each Plus/Premium domain is its own line) and per business
      unit; review-invitation volume can be attributed to the same domain dimension.
  - name: Optimization
    description: Right-size the tier (Starter caps at 100 invitations, Plus at 300, Premium at 1000) and
      avoid the Premium/Enterprise API add-on unless you actually need programmatic access; consume reviews
      via webhooks rather than polling to avoid scaling pressure on the API tier.
  - name: Accountability
    description: Assign a marketing or CX owner per domain who controls invitation sends, integrations,
      and renewal of the 12-month prepaid contract.
maintainers:
