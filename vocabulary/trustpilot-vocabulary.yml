vocabulary:
  name: Trustpilot Vocabulary
  description: >-
    Domain vocabulary and terminology for Trustpilot APIs, covering reviews,
    trust scores, business profiles, invitations, and consumer feedback concepts.
  version: "1.0.0"
  created: "2026-05-03"
  modified: "2026-05-03"

terms:
  - term: TrustScore
    definition: >-
      Trustpilot's proprietary score (0-5) representing a business's overall trustworthiness
      based on recent reviews. Calculated dynamically, with recent reviews weighted more
      heavily than older ones.
    tags:
      - Trust
      - Ratings

  - term: Business Unit
    definition: >-
      A business profile on Trustpilot identified by a unique ID and associated with a
      domain name. Businesses can have multiple business units for different brands or locations.
    tags:
      - Business Profiles

  - term: Business Unit ID
    definition: >-
      A 24-character hexadecimal identifier uniquely identifying a Trustpilot business unit
      (e.g., 46d6a890ffa235a75b00021d). Required for most Business Units, Service Reviews,
      and Invitation API endpoints.
    tags:
      - Business Profiles

  - term: Service Review
    definition: >-
      A consumer review about the overall experience with a business, covering service quality,
      customer support, and general satisfaction. Displayed on the business's Trustpilot profile.
    tags:
      - Reviews
      - Consumer Reviews

  - term: Product Review
    definition: >-
      A consumer review about a specific product purchased from a business, covering product
      quality, features, and value. Linked to a specific product SKU.
    tags:
      - Product Reviews
      - Reviews

  - term: Verified Review
    definition: >-
      A review where Trustpilot has confirmed the reviewer had a genuine experience with
      the business, typically through invitation-based review collection or order verification.
    tags:
      - Reviews
      - Trust

  - term: Review Invitation
    definition: >-
      An automated email sent to customers after a purchase or service interaction, inviting
      them to leave a review on Trustpilot. Invitation-based reviews are marked as verified.
    tags:
      - Invitations
      - Reviews

  - term: Invitation Link
    definition: >-
      A unique URL generated by the Trustpilot Invitation API that businesses can share
      with customers to collect reviews. Each link is associated with a reference number.
    tags:
      - Invitations

  - term: Page Token
    definition: >-
      A cursor value returned in paginated API responses for the Business Units API,
      used to retrieve the next page of results. Enables retrieval of large review sets.
    tags:
      - Pagination
      - Reviews

  - term: Review Reply
    definition: >-
      A company's public response to a consumer review on Trustpilot. Replies are visible
      to all users and can be created, updated, or deleted via the Service Reviews API.
    tags:
      - Reviews
      - Customer Experience

  - term: Review Tag
    definition: >-
      A custom label applied to a review by the business for internal categorization.
      Tags consist of a group and value pair (e.g., group: "topic", value: "shipping").
    tags:
      - Reviews

  - term: Consumer
    definition: >-
      A Trustpilot user who writes reviews. Identified by a consumer ID and display name
      in public APIs; email is only available in private (authenticated) API responses.
    tags:
      - Consumer Reviews

  - term: OAuth 2.0
    definition: >-
      Trustpilot uses OAuth 2.0 for authentication on private API endpoints. Supported
      flows include Authorization Code (for user-facing integrations), Client Credentials
      (for server-to-server), Implicit, and Password flows.
    tags:
      - Authentication
      - Security

  - term: API Key
    definition: >-
      A public API key passed as the apikey query parameter to access Trustpilot's
      public endpoints for read-only data like business profiles, public reviews,
      and review summaries.
    tags:
      - Authentication

  - term: Stars
    definition: >-
      The numerical rating given to a review, from 1 (terrible) to 5 (excellent).
      In Trustpilot API responses, stars appears as both integer (individual review)
      and decimal (average/aggregate).
    tags:
      - Ratings
      - Reviews

  - term: Conversation
    definition: >-
      A thread associated with a product review where businesses and consumers can
      exchange comments. Created via the Product Reviews API's create-conversation endpoint.
    tags:
      - Product Reviews

  - term: SKU
    definition: >-
      Stock Keeping Unit — the product identifier used in Trustpilot's Product Reviews
      API to associate reviews with specific products in a business's catalog.
    tags:
      - Product Reviews
